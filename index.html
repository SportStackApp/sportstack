    <script>
      // Apply the last known theme before React paints; the signed-in account
      // preference then confirms it from Supabase on every device.
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (_) {
        // Storage can be unavailable in a restricted browser; light is safe.
      }
    </script>
