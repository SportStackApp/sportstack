name: Production Supabase Scrapers

on:
  schedule:
    # GitHub schedules use UTC. Local times move by one hour during daylight saving.
    - cron: "7,22,37,52 * * * *" # Due-fixture check every 15 minutes
    - cron: "30 14 * * 1-6" # Nightly full catch-up: 00:30 AEST / 01:30 AEDT
    - cron: "30 14 * * 0" # Monday early catch-up plus weekly backup
    - cron: "0 19 * * 1" # Tuesday morning registry plus weekly backup
    - cron: "0 19 * * 4" # Friday morning registry refresh
    - cron: "0 20 * * 1" # Tuesday morning player history
    - cron: "0 16 * * 0" # Monday retention report after weekly backup
  workflow_dispatch:
    inputs:
      task:
        description: What should be refreshed in Production?
        required: true
        default: storage-diagnostics
        type: choice
        options:
          - storage-diagnostics
          - storage-retention-dry-run
          - storage-retention-apply
          - due-fixture-refresh
          - all
          - match-scrapers
          - hockey-ballarat
          - sunraysia
          - wimmera
          - player-registry
          - player-history
      write_to_production:
        description: Allow this manual scraper run to write to Production Supabase
        required: true
        default: false
        type: boolean
      upload_backup:
        description: Save a compressed backup snapshot to Production Storage
        required: true
        default: false
        type: boolean
      retention_expected_delete_count:
        description: Approved retention deletion object count (apply only)
        required: false
        type: string
      retention_expected_delete_bytes:
        description: Approved retention deletion byte count (apply only)
        required: false
        type: string
      retention_expected_plan_sha256:
        description: Approved retention plan SHA-256 (apply only)
        required: false
        type: string
      retention_production_approval:
        description: Exact approval phrase shown in the operations guide (apply only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-supabase-scrapers
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"
  EXPECTED_SUPABASE_PROJECT_REF: svierarfcolhcfjpmwck

jobs:
  storage-diagnostics:
    name: Inspect Production Storage usage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report read-only Production Storage usage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/inspect_supabase_storage_usage.py

  storage-retention-dry-run:
    name: Plan Production scrape-backup retention
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 16 * * 0') ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.task == 'storage-retention-dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Report read-only Production retention plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/retain_scrape_backups.py
          --expected-project-ref svierarfcolhcfjpmwck

  storage-retention-apply:
    name: Apply approved Production scrape-backup retention
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-retention-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply exactly approved Production retention plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RETENTION_EXPECTED_DELETE_COUNT: ${{ inputs.retention_expected_delete_count }}
          RETENTION_EXPECTED_DELETE_BYTES: ${{ inputs.retention_expected_delete_bytes }}
          RETENTION_EXPECTED_PLAN_SHA256: ${{ inputs.retention_expected_plan_sha256 }}
          RETENTION_PRODUCTION_APPROVAL: ${{ inputs.retention_production_approval }}
        run: |
          python scripts/retain_scrape_backups.py --apply \
            --expected-project-ref svierarfcolhcfjpmwck \
            --expected-delete-count "$RETENTION_EXPECTED_DELETE_COUNT" \
            --expected-delete-bytes "$RETENTION_EXPECTED_DELETE_BYTES" \
            --expected-plan-sha256 "$RETENTION_EXPECTED_PLAN_SHA256" \
            --production-approval "$RETENTION_PRODUCTION_APPROVAL"

  select-due-fixtures:
    name: Select completed fixture windows
    if: >-
      (github.event_name == 'schedule' &&
        github.event.schedule == '7,22,37,52 * * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.task == 'due-fixture-refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install selector dependency
        run: pip install -r scraper/requirements-supabase.txt
      - name: Build safe due-fixture matrix
        id: select
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/select_due_fixture_scrapes.py

  targeted-match-scrapes:
    name: Target game ${{ matrix.game_id }}
    needs: select-due-fixtures
    if: >-
      needs.select-due-fixtures.result == 'success' &&
      needs.select-due-fixtures.outputs.count != '0' &&
      (github.event_name == 'schedule' || inputs.write_to_production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.select-due-fixtures.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-match.txt
      - name: Verify fixture start from its current round page
        id: preflight
        env:
          FIXTURE_ID: ${{ matrix.fixture_id }}
          PORTAL_URL: ${{ matrix.portal_url }}
          TARGET_MATCH_URL: ${{ matrix.match_url }}
          TARGET_COMPETITION_ID: ${{ matrix.competition_id }}
          TARGET_GRADE_ID: ${{ matrix.grade_id }}
          TARGET_ROUND_NUMBER: ${{ matrix.round_number }}
          TARGET_TIMEZONE: ${{ matrix.timezone }}
          TARGET_DURATION_MINUTES: ${{ matrix.duration_minutes }}
          APPLY_SCHEDULE_UPDATE: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/verify_due_fixture_schedule.py
      - name: Scrape only the selected fixture
        if: steps.preflight.outputs.should_scrape == 'true'
        env:
          PORTAL_URL: ${{ matrix.portal_url }}
          ASSOCIATION_NAME: ${{ matrix.association_name }}
          OUTPUT_DIR: ${{ matrix.output_dir }}
          TARGET_MATCH_URL: ${{ matrix.match_url }}
          TARGET_COMPETITION_NAME: ${{ matrix.competition_name }}
          TARGET_GRADE: ${{ matrix.grade }}
          TARGET_ROUND: ${{ matrix.round_name }}
          TARGET_COMPETITION_ID: ${{ matrix.competition_id }}
          TARGET_GRADE_ID: ${{ matrix.grade_id }}
          TARGET_HOME_TEAM_URL: ${{ matrix.home_team_url }}
          TARGET_AWAY_TEAM_URL: ${{ matrix.away_team_url }}
          TARGET_HOME_TEAM_LABEL: ${{ matrix.home_team_label }}
          TARGET_AWAY_TEAM_LABEL: ${{ matrix.away_team_label }}
          TARGET_GAME_DATE: ${{ steps.preflight.outputs.game_date }}
          TARGET_GAME_TIME: ${{ steps.preflight.outputs.game_time }}
          TARGET_VENUE: ${{ matrix.venue }}
          TARGET_PITCH: ${{ matrix.pitch }}
          TARGET_VENUE_URL: ${{ matrix.venue_url }}
          TARGET_VENUE_ID: ${{ matrix.venue_id }}
          TARGET_UMPIRE_1: ${{ matrix.umpire_1 }}
          TARGET_UMPIRE_2: ${{ matrix.umpire_2 }}
          UPSERT_SUPABASE: "true"
          UPSERT_SUPABASE_V2: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py
      - name: Import only the selected fixture
        if: steps.preflight.outputs.should_scrape == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py --apply
          --association "${{ matrix.association_name }}"
          --match-url "${{ matrix.match_url }}"

  match-scrapers:
    name: ${{ matrix.association }} to Production
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '30 14 * * 1-6' ||
         github.event.schedule == '30 14 * * 0')) ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' ||
         inputs.task == 'match-scrapers' ||
         inputs.task == 'hockey-ballarat' ||
         inputs.task == 'sunraysia' ||
         inputs.task == 'wimmera'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: hockey-ballarat
            association: Hockey Ballarat
            portal_url: https://www.revolutionise.com.au/hockeyballarat
            output_dir: data/hockey-ballarat
            source_name: hockey-ballarat
            competition_id: ""
          - task: sunraysia
            association: Sunraysia Hockey Association
            portal_url: https://www.sunraysiahockey.com.au
            output_dir: data/sunraysia
            source_name: sunraysia
            competition_id: ""
          - task: wimmera
            association: Wimmera Hockey Association
            portal_url: https://www.revolutionise.com.au/wimmeraha
            output_dir: data/wimmera
            source_name: wimmera
            competition_id: "26593"
    env:
      SOURCE_SELECTED: >-
        ${{ github.event_name == 'schedule' ||
            inputs.task == 'all' ||
            inputs.task == 'match-scrapers' ||
            inputs.task == matrix.task }}
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.write_to_production }}
      UPLOAD_BACKUP: >-
        ${{ github.event_name == 'schedule' && github.event.schedule == '30 14 * * 0' && 'true' ||
            github.event_name == 'workflow_dispatch' && inputs.upload_backup && 'true' || 'false' }}
    steps:
      - name: Check out repository
        if: env.SOURCE_SELECTED == 'true'
        uses: actions/checkout@v4
      - name: Set up Python
        if: env.SOURCE_SELECTED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        if: env.SOURCE_SELECTED == 'true'
        run: pip install -r scraper/requirements-match.txt
      - name: Run match scraper
        if: env.SOURCE_SELECTED == 'true'
        env:
          PORTAL_URL: ${{ matrix.portal_url }}
          ASSOCIATION_NAME: ${{ matrix.association }}
          OUTPUT_DIR: ${{ matrix.output_dir }}
          COMPETITION_ID: ${{ matrix.competition_id }}
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py
      - name: Upload compressed Production backup
        if: env.SOURCE_SELECTED == 'true' && env.UPLOAD_BACKUP == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/upload_scrape_backups_to_storage.py
          --source-dir "${{ matrix.output_dir }}"
          --source-name "${{ matrix.source_name }}"
      - name: Import mapped V2 fixtures into Production
        if: env.SOURCE_SELECTED == 'true' && env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py --apply
          --association "${{ matrix.association }}"

  player-registry:
    name: Player registry to Production
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '0 19 * * 1' ||
         github.event.schedule == '0 19 * * 4')) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.write_to_production &&
        (inputs.task == 'all' || inputs.task == 'player-registry'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      UPLOAD_BACKUP: >-
        ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * 1' && 'true' ||
            github.event_name == 'workflow_dispatch' && inputs.upload_backup && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-browser.txt
      - name: Install Playwright browser
        run: python -m playwright install chromium
      - name: Run player registry scraper
        env:
          OUTPUT_DIR: data/player-registry
        run: python scraper/player_registry_scraper.py
      - name: Upload compressed player registry backup
        if: env.UPLOAD_BACKUP == 'true'
        run: >-
          python scripts/upload_scrape_backups_to_storage.py
          --source-dir data/player-registry
          --source-name player-registry

  player-history:
    name: Player history to Production
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.write_to_production &&
        (inputs.task == 'all' || inputs.task == 'player-history'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      UPLOAD_BACKUP: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_backup }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-browser.txt
      - name: Install Playwright browser
        run: python -m playwright install chromium
      - name: Run player history scraper
        env:
          OUTPUT_DIR: data/player-history
        run: python scraper/history_scraper.py
      - name: Upload compressed player history backup
        if: env.UPLOAD_BACKUP == 'true'
        run: >-
          python scripts/upload_scrape_backups_to_storage.py
          --source-dir data/player-history
          --source-name player-history
