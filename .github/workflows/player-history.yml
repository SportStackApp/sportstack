# .github/workflows/player-history.yml
#
# Player History Scraper
# Reads all players from revsports_player_registry in Supabase,
# then visits each player's career history page on RevSports.
#
# Also uploads CSV backups from data/player-history/ to Supabase Storage.
#
# Uses Playwright (headless Chromium) because history pages are
# JavaScript-rendered.
#
# Manual fallback only. Normal Production scheduling is owned by
# production-scrapers.yml so it cannot accidentally run twice.
#
# With ~727 players at 0.8s delay, expect ~15–20 minutes to complete.

name: Player History Scraper

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm this fallback may write to Production
        required: true
        default: STOP
        type: choice
        options:
          - STOP
          - RUN_PRODUCTION
      upload_backup:
        description: Save a compressed Production Storage backup?
        required: true
        default: false
        type: boolean

jobs:
  scrape-history:
    if: inputs.confirm_production == 'RUN_PRODUCTION'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scraper/requirements-browser.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player history scraper
        env:
          OUTPUT_DIR:           "data/player-history"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/history_scraper.py

      - name: Upload backup to Supabase Storage
        if: inputs.upload_backup
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/player-history \
            --source-name player-history
