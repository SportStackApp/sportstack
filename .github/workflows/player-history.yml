# .github/workflows/player-history.yml
#
# Player History Scraper
# Reads all players from revsports_player_registry in Supabase,
# then visits each player's career history page on RevSports.
#
# Also saves a CSV backup to data/player-history/ in the repo.
#
# Uses Playwright (headless Chromium) because history pages are
# JavaScript-rendered.
#
# Schedule (AEST = UTC+10):
#   Wednesday night — 3am AEST (1 hour after registry scraper)
#   Sunday night    — 3am AEST (1 hour after registry scraper)
#
# Runs 1 hour after the registry scraper each time so player IDs are ready.
# With ~727 players at 0.8s delay, expect ~15–20 minutes to complete.
#
# Manual trigger: Actions tab → "Player History Scraper" → Run workflow

name: Player History Scraper

on:
  schedule:
    # Wednesday night 3am AEST = 17:00 UTC Wednesday
    - cron: "0 17 * * 3"

    # Sunday night 3am AEST = 17:00 UTC Sunday
    - cron: "0 17 * * 0"

  workflow_dispatch:

jobs:
  scrape-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4 supabase

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player history scraper
        env:
          OUTPUT_DIR:           "data/player-history"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/history_scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scrape(history): $(date '+%Y-%m-%d %H:%M') AEST"
          git pull --rebase -X theirs
          git push
