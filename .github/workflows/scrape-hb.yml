# .github/workflows/scrape-hb.yml
#
# Match Scraper â€” Hockey Ballarat
# Scrapes match results and player appearances from RevSports.
# Can write directly to Supabase (revsports_players table) when enabled.
# Also saves a CSV backup to the /data folder in the repo.
#
# Schedule (AEST = UTC+10):
#   Daily       â€” 2am AEST every day
#   Sat & Sun   â€” hourly from 8am to 8pm AEST (on the hour)
#
# Staggering: HB runs on the hour (:00). Sunraysia runs on the half hour (:30).
#
# Manual trigger: Actions tab â†’ "Scrape â€” Hockey Ballarat" â†’ Run workflow

name: Scrape â€” Hockey Ballarat

on:
  schedule:
    # â”€â”€ Daily 2am AEST (16:00 UTC) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    - cron: "0 16 * * *"

    # â”€â”€ Saturday hourly 8amâ€“8pm AEST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    # Sat 8am  AEST = 22:00 UTC Fri  â†’ day-of-week 5
    # Sat 9amâ€“8pm AEST = 23:00â€“10:00 UTC Sat â†’ day-of-week 6
    - cron: "0 22 * * 5"   # 8:00am Sat
    - cron: "0 23 * * 5"   # 9:00am Sat
    - cron: "0 0  * * 6"   # 10:00am Sat
    - cron: "0 1  * * 6"   # 11:00am Sat
    - cron: "0 2  * * 6"   # 12:00pm Sat
    - cron: "0 3  * * 6"   # 1:00pm Sat
    - cron: "0 4  * * 6"   # 2:00pm Sat
    - cron: "0 5  * * 6"   # 3:00pm Sat
    - cron: "0 6  * * 6"   # 4:00pm Sat
    - cron: "0 7  * * 6"   # 5:00pm Sat
    - cron: "0 8  * * 6"   # 6:00pm Sat
    - cron: "0 9  * * 6"   # 7:00pm Sat
    - cron: "0 10 * * 6"   # 8:00pm Sat

    # â”€â”€ Sunday hourly 8amâ€“8pm AEST â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    # Sun 8am  AEST = 22:00 UTC Sat â†’ day-of-week 6
    # Sun 9amâ€“8pm AEST = 23:00â€“10:00 UTC Sun â†’ day-of-week 0
    - cron: "0 22 * * 6"   # 8:00am Sun
    - cron: "0 23 * * 6"   # 9:00am Sun
    - cron: "0 0  * * 0"   # 10:00am Sun
    - cron: "0 1  * * 0"   # 11:00am Sun
    - cron: "0 2  * * 0"   # 12:00pm Sun
    - cron: "0 3  * * 0"   # 1:00pm Sun
    - cron: "0 4  * * 0"   # 2:00pm Sun
    - cron: "0 5  * * 0"   # 3:00pm Sun
    - cron: "0 6  * * 0"   # 4:00pm Sun
    - cron: "0 7  * * 0"   # 5:00pm Sun
    - cron: "0 8  * * 0"   # 6:00pm Sun
    - cron: "0 9  * * 0"   # 7:00pm Sun
    - cron: "0 10 * * 0"   # 8:00pm Sun

  workflow_dispatch:
    inputs:
      only_grades:
        description: 'Grades to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_rounds:
        description: 'Rounds to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_team:
        description: 'Team name filter (partial match, blank = all)'
        required: false
        default: ''
      upload_to_supabase:
        description: 'Upload scraped rows to Supabase? Scheduled runs always upload.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Remove legacy output files
        run: |
          rm -f data/hockey-ballarat/hockey_results.csv
          rm -f data/hockey-ballarat/hockey_results.json

      - name: Run scraper
        env:
          PORTAL_URL:           "https://www.revolutionise.com.au/hockeyballarat"
          ASSOCIATION_NAME:     "Hockey Ballarat"
          OUTPUT_DIR:           "data/hockey-ballarat"
          UPSERT_SUPABASE:      ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2:   ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_GRADES:          ${{ github.event.inputs.only_grades || '' }}
          ONLY_ROUNDS:          ${{ github.event.inputs.only_rounds || '' }}
          ONLY_TEAM:            ${{ github.event.inputs.only_team   || '' }}
        run: python scraper/scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data/hockey-ballarat

          if git diff --cached --quiet; then
            echo "No data/hockey-ballarat changes to commit."
          else
            git commit -m "scrape(hb): latest output"
            git pull --rebase -X theirs
            git push
          fi

      - name: Run fixture import
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply
