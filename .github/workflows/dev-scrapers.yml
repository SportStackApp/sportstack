name: Dev Supabase Scrapers

on:
  schedule:
    # GitHub schedules use UTC. These run early morning in Melbourne.
    - cron: "0 18 * * *" # Match scrapers: 04:00 AEST / 05:00 AEDT
    - cron: "0 19 * * *" # Player registry: 05:00 AEST / 06:00 AEDT
    - cron: "0 20 * * 0,3" # Player history: Sun/Wed, 06:00 AEST / 07:00 AEDT
  workflow_dispatch:
    inputs:
      task:
        description: What should be refreshed in Dev?
        required: true
        default: all
        type: choice
        options:
          - all
          - match-scrapers
          - hockey-ballarat
          - sunraysia
          - wimmera
          - player-registry
          - player-history
          - storage-diagnostics
          - storage-retention-dry-run
      upload_to_supabase:
        description: Upload match scraper results to Dev Supabase
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  storage-diagnostics:
    name: Inspect Dev Storage usage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report read-only Dev Storage usage
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scripts/inspect_supabase_storage_usage.py

  storage-retention-dry-run:
    name: Plan Dev scrape-backup retention
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-retention-dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report read-only Dev scrape-backup retention plan
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scripts/retain_scrape_backups.py

  hockey-ballarat:
    name: Hockey Ballarat to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'hockey-ballarat'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run Hockey Ballarat scraper
        env:
          PORTAL_URL: https://www.revolutionise.com.au/hockeyballarat
          ASSOCIATION_NAME: Hockey Ballarat
          OUTPUT_DIR: data/hockey-ballarat
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/hockey-ballarat \
            --source-name hockey-ballarat

      - name: Import staged fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply

  sunraysia:
    name: Sunraysia Hockey Association to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'sunraysia'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run Sunraysia scraper
        env:
          PORTAL_URL: https://www.sunraysiahockey.com.au
          ASSOCIATION_NAME: Sunraysia Hockey Association
          OUTPUT_DIR: data/sunraysia
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/sunraysia \
            --source-name sunraysia

      - name: Import staged fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply

  wimmera:
    name: Wimmera Hockey Association to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'wimmera'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run Wimmera scraper
        env:
          PORTAL_URL: https://www.revolutionise.com.au/wimmeraha
          ASSOCIATION_NAME: Wimmera Hockey Association
          OUTPUT_DIR: data/wimmera
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          COMPETITION_ID: "26593"
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/wimmera \
            --source-name wimmera

      - name: Import staged fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply

  player-registry:
    name: Player registry to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'player-registry'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install playwright beautifulsoup4 supabase

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player registry scraper
        env:
          OUTPUT_DIR: data/player-registry
        run: python scraper/player_registry_scraper.py

      - name: Upload player registry backup to Dev Storage
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/player-registry \
            --source-name player-registry

  player-history:
    name: Player history to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 0,3') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'player-history'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install playwright beautifulsoup4 supabase

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player history scraper
        env:
          OUTPUT_DIR: data/player-history
        run: python scraper/history_scraper.py

      - name: Upload player history backup to Dev Storage
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/player-history \
            --source-name player-history
