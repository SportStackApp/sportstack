name: Dev Supabase Scrapers

on:
  schedule:
    # GitHub schedules use UTC. These run early morning in Melbourne.
    - cron: "0 18 * * 1" # Tuesday morning match scraper verification
    - cron: "0 19 * * 1" # Tuesday morning registry plus weekly backup
    - cron: "0 19 * * 4" # Friday morning registry without another backup
    - cron: "0 20 * * 1" # Tuesday morning player history
    - cron: "0 21 * * 1" # Tuesday morning read-only retention report
  workflow_dispatch:
    inputs:
      task:
        description: What should be refreshed in Dev?
        required: true
        default: all
        type: choice
        options:
          - all
          - match-scrapers
          - hockey-ballarat
          - sunraysia
          - wimmera
          - fixture-import
          - player-registry
          - player-history
          - storage-diagnostics
          - storage-retention-dry-run
          - storage-retention-apply
      upload_to_supabase:
        description: Upload match scraper results to Dev Supabase
        required: true
        default: true
        type: boolean
      upload_backup:
        description: Save a compressed backup snapshot to Dev Storage
        required: true
        default: false
        type: boolean
      apply_fixture_import:
        description: Apply fixture changes after the preview checks pass
        required: true
        default: false
        type: boolean
      retention_expected_delete_count:
        description: Approved retention deletion object count (apply only)
        required: false
        type: string
      retention_expected_delete_bytes:
        description: Approved retention deletion byte count (apply only)
        required: false
        type: string
      retention_expected_plan_sha256:
        description: Approved retention plan SHA-256 (apply only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dev-supabase-scrapers
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUNBUFFERED: "1"

jobs:
  fixture-import:
    name: RevSports fixture import to Dev
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'fixture-import'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Supabase dependency
        run: pip install -r scraper/requirements-supabase.txt

      - name: Preview or import all mapped V2 fixtures into Dev
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py
          ${{ inputs.apply_fixture_import && '--apply' || '' }}

  storage-diagnostics:
    name: Inspect Dev Storage usage
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report read-only Dev Storage usage
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          EXPECTED_SUPABASE_PROJECT_REF: icqegnpjbizccjebjfhb
        run: python scripts/inspect_supabase_storage_usage.py

  storage-retention-dry-run:
    name: Plan Dev scrape-backup retention
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 21 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.task == 'storage-retention-dry-run')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Report read-only Dev scrape-backup retention plan
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          EXPECTED_SUPABASE_PROJECT_REF: icqegnpjbizccjebjfhb
        run: >-
          python scripts/retain_scrape_backups.py
          --expected-project-ref icqegnpjbizccjebjfhb

  storage-retention-apply:
    name: Apply approved Dev scrape-backup retention
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.task == 'storage-retention-apply'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exactly approved Dev scrape-backup retention plan
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
          EXPECTED_SUPABASE_PROJECT_REF: icqegnpjbizccjebjfhb
          RETENTION_EXPECTED_DELETE_COUNT: ${{ inputs.retention_expected_delete_count }}
          RETENTION_EXPECTED_DELETE_BYTES: ${{ inputs.retention_expected_delete_bytes }}
          RETENTION_EXPECTED_PLAN_SHA256: ${{ inputs.retention_expected_plan_sha256 }}
        run: |
          python scripts/retain_scrape_backups.py --apply \
            --expected-project-ref icqegnpjbizccjebjfhb \
            --expected-delete-count "$RETENTION_EXPECTED_DELETE_COUNT" \
            --expected-delete-bytes "$RETENTION_EXPECTED_DELETE_BYTES" \
            --expected-plan-sha256 "$RETENTION_EXPECTED_PLAN_SHA256"

  hockey-ballarat:
    name: Hockey Ballarat to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'hockey-ballarat'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}
      UPLOAD_BACKUP: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_backup }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-match.txt

      - name: Run Hockey Ballarat scraper
        env:
          PORTAL_URL: https://www.revolutionise.com.au/hockeyballarat
          ASSOCIATION_NAME: Hockey Ballarat
          OUTPUT_DIR: data/hockey-ballarat
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        if: env.UPLOAD_BACKUP == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/hockey-ballarat \
            --source-name hockey-ballarat

      - name: Preview or import mapped V2 fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py
          ${{ (github.event_name == 'schedule' || inputs.apply_fixture_import) && '--apply' || '' }}
          --association "Hockey Ballarat"

  sunraysia:
    name: Sunraysia Hockey Association to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'sunraysia'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}
      UPLOAD_BACKUP: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_backup }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-match.txt

      - name: Run Sunraysia scraper
        env:
          PORTAL_URL: https://www.sunraysiahockey.com.au
          ASSOCIATION_NAME: Sunraysia Hockey Association
          OUTPUT_DIR: data/sunraysia
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        if: env.UPLOAD_BACKUP == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/sunraysia \
            --source-name sunraysia

      - name: Preview or import mapped V2 fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py
          ${{ (github.event_name == 'schedule' || inputs.apply_fixture_import) && '--apply' || '' }}
          --association "Sunraysia Hockey Association"

  wimmera:
    name: Wimmera Hockey Association to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'match-scrapers' || inputs.task == 'wimmera'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}
      UPLOAD_BACKUP: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_backup }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-match.txt

      - name: Run Wimmera scraper
        env:
          PORTAL_URL: https://www.revolutionise.com.au/wimmeraha
          ASSOCIATION_NAME: Wimmera Hockey Association
          OUTPUT_DIR: data/wimmera
          UPSERT_SUPABASE: ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2: ${{ env.UPLOAD_TO_SUPABASE }}
          COMPETITION_ID: "26593"
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Upload scraper backup to Dev Storage
        if: env.UPLOAD_BACKUP == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/wimmera \
            --source-name wimmera

      - name: Preview or import mapped V2 fixtures into Dev
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
        run: >-
          python scripts/import_revsports_fixtures_v2.py
          ${{ (github.event_name == 'schedule' || inputs.apply_fixture_import) && '--apply' || '' }}
          --association "Wimmera Hockey Association"

  player-registry:
    name: Player registry to Dev
    if: >-
      (github.event_name == 'schedule' &&
        (github.event.schedule == '0 19 * * 1' ||
         github.event.schedule == '0 19 * * 4')) ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'player-registry'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
      UPLOAD_BACKUP: >-
        ${{ github.event_name == 'schedule' && github.event.schedule == '0 19 * * 1' && 'true' ||
            github.event_name == 'workflow_dispatch' && inputs.upload_backup && 'true' || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-browser.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player registry scraper
        env:
          OUTPUT_DIR: data/player-registry
        run: python scraper/player_registry_scraper.py

      - name: Upload player registry backup to Dev Storage
        if: env.UPLOAD_BACKUP == 'true'
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/player-registry \
            --source-name player-registry

  player-history:
    name: Player history to Dev
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.task == 'all' || inputs.task == 'player-history'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_KEY }}
      UPLOAD_BACKUP: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_backup }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements-browser.txt

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player history scraper
        env:
          OUTPUT_DIR: data/player-history
        run: python scraper/history_scraper.py

      - name: Upload player history backup to Dev Storage
        if: env.UPLOAD_BACKUP == 'true'
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/player-history \
            --source-name player-history
