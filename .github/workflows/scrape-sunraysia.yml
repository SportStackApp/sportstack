# .github/workflows/scrape-sunraysia.yml
#
# Scrapes Sunraysia Hockey Association results, commits them to /data,
# and upserts the rows into Supabase automatically.
#
# Schedule (all times AEST = UTC+10):
#   Weekdays  — once at 10:00pm AEST
#   Weekends  — every 2 hours from 8:00am to 10:00pm AEST
name: Scrape — Sunraysia Hockey Association

on:
  schedule:
    - cron: "0 12 * * 1-5"
    - cron: "0 22 * * 5,6"
    - cron: "0 0  * * 6,0"
    - cron: "0 2  * * 6,0"
    - cron: "0 4  * * 6,0"
    - cron: "0 6  * * 6,0"
    - cron: "0 8  * * 6,0"
    - cron: "0 10 * * 6,0"
    - cron: "0 12 * * 6,0"

  workflow_dispatch:
    inputs:
      only_grades:
        description: 'Grades to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_rounds:
        description: 'Rounds to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_team:
        description: 'Team name filter (partial match, blank = all)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # supabase added so the scraper can upsert results automatically
        run: pip install requests beautifulsoup4 supabase==2.10.0

      - name: Run scraper
        env:
          PORTAL_URL:           "https://www.sunraysiahockey.com.au"
          ASSOCIATION_NAME:     "Sunraysia Hockey Association"
          ONLY_GRADES:          ${{ github.event.inputs.only_grades || '' }}
          ONLY_ROUNDS:          ${{ github.event.inputs.only_rounds || '' }}
          ONLY_TEAM:            ${{ github.event.inputs.only_team   || '' }}
          OUTPUT_DIR:           data/sunraysia
          # Supabase secrets — set these in GitHub repo Settings → Secrets → Actions
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scrape [sunraysia]: $(date '+%Y-%m-%d %H:%M') AEST"
          git pull --rebase -X theirs
          git push
