# .github/workflows/scrape-sunraysia.yml
#
# Match Scraper — Sunraysia Hockey Association
# Scrapes match results and player appearances from RevSports.
# Can write directly to Supabase (revsports_players table) when enabled.
# Also saves a CSV backup to the /data folder in the repo.
#
# Sunraysia runs both grass field and indoor competitions.
# Indoor rounds are played on Friday evenings — extra runs added for those.
#
# Schedule (AEST = UTC+10):
#   Daily           — 2am AEST every day
#   Sat & Sun       — hourly from 7:30am to 7:30pm AEST (on the half hour)
#   Friday evenings — hourly from 4:30pm to 10:30pm AEST (indoor competition)
#
# Staggering: Sunraysia runs on the half hour (:30). HB runs on the hour (:00).
#
# Manual trigger: Actions tab → "Scrape — Sunraysia Hockey Association" → Run workflow

name: Scrape — Sunraysia Hockey Association

on:
  schedule:
    # ── Daily 2am AEST (16:00 UTC) ───────────────────────────
    - cron: "0 16 * * *"

    # ── Friday evening hourly 4:30pm–10:30pm AEST (indoor) ───
    # AEST = UTC+10, so subtract 10hrs
    # 4:30pm Fri AEST  = 06:30 UTC Fri
    # 5:30pm Fri AEST  = 07:30 UTC Fri
    # 6:30pm Fri AEST  = 08:30 UTC Fri
    # 7:30pm Fri AEST  = 09:30 UTC Fri
    # 8:30pm Fri AEST  = 10:30 UTC Fri
    # 9:30pm Fri AEST  = 11:30 UTC Fri
    # 10:30pm Fri AEST = 12:30 UTC Fri
    - cron: "30 6  * * 5"   # 4:30pm Fri
    - cron: "30 7  * * 5"   # 5:30pm Fri
    - cron: "30 8  * * 5"   # 6:30pm Fri
    - cron: "30 9  * * 5"   # 7:30pm Fri
    - cron: "30 10 * * 5"   # 8:30pm Fri
    - cron: "30 11 * * 5"   # 9:30pm Fri
    - cron: "30 12 * * 5"   # 10:30pm Fri

    # ── Saturday hourly 7:30am–7:30pm AEST ───────────────────
    # Sat 7:30am  AEST = 21:30 UTC Fri → day-of-week 5
    # Sat 8:30am–7:30pm AEST = 22:30–09:30 UTC Sat → day-of-week 6
    - cron: "30 21 * * 5"   # 7:30am Sat
    - cron: "30 22 * * 5"   # 8:30am Sat
    - cron: "30 23 * * 5"   # 9:30am Sat
    - cron: "30 0  * * 6"   # 10:30am Sat
    - cron: "30 1  * * 6"   # 11:30am Sat
    - cron: "30 2  * * 6"   # 12:30pm Sat
    - cron: "30 3  * * 6"   # 1:30pm Sat
    - cron: "30 4  * * 6"   # 2:30pm Sat
    - cron: "30 5  * * 6"   # 3:30pm Sat
    - cron: "30 6  * * 6"   # 4:30pm Sat
    - cron: "30 7  * * 6"   # 5:30pm Sat
    - cron: "30 8  * * 6"   # 6:30pm Sat
    - cron: "30 9  * * 6"   # 7:30pm Sat

    # ── Sunday hourly 7:30am–7:30pm AEST ─────────────────────
    # Sun 7:30am  AEST = 21:30 UTC Sat → day-of-week 6
    # Sun 8:30am–7:30pm AEST = 22:30–09:30 UTC Sun → day-of-week 0
    - cron: "30 21 * * 6"   # 7:30am Sun
    - cron: "30 22 * * 6"   # 8:30am Sun
    - cron: "30 23 * * 6"   # 9:30am Sun
    - cron: "30 0  * * 0"   # 10:30am Sun
    - cron: "30 1  * * 0"   # 11:30am Sun
    - cron: "30 2  * * 0"   # 12:30pm Sun
    - cron: "30 3  * * 0"   # 1:30pm Sun
    - cron: "30 4  * * 0"   # 2:30pm Sun
    - cron: "30 5  * * 0"   # 3:30pm Sun
    - cron: "30 6  * * 0"   # 4:30pm Sun
    - cron: "30 7  * * 0"   # 5:30pm Sun
    - cron: "30 8  * * 0"   # 6:30pm Sun
    - cron: "30 9  * * 0"   # 7:30pm Sun

  workflow_dispatch:
    inputs:
      only_grades:
        description: 'Grades to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_rounds:
        description: 'Rounds to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_team:
        description: 'Team name filter (partial match, blank = all)'
        required: false
        default: ''
      upload_to_supabase:
        description: 'Upload scraped rows to Supabase? Scheduled runs always upload.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run scraper
        env:
          PORTAL_URL:           "https://www.sunraysiahockey.com.au"
          ASSOCIATION_NAME:     "Sunraysia Hockey Association"
          OUTPUT_DIR:           "data/sunraysia"
          UPSERT_SUPABASE:      ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2:   ${{ env.UPLOAD_TO_SUPABASE }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_GRADES:          ${{ github.event.inputs.only_grades || '' }}
          ONLY_ROUNDS:          ${{ github.event.inputs.only_rounds || '' }}
          ONLY_TEAM:            ${{ github.event.inputs.only_team   || '' }}
        run: python scraper/scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data/sunraysia

          if git diff --cached --quiet; then
            echo "No data/sunraysia changes to commit."
          else
            git commit -m "scrape(sunraysia): latest output"
            git pull --rebase -X theirs
            git push
          fi

      - name: Run fixture import
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py
