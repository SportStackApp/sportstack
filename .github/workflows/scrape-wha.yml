# .github/workflows/scrape-wha.yml
#
# Match Scraper — Wimmera Hockey Association
# Scrapes fixture and result data from RevSports.
# Player data is login-protected on WHA — fixture/result data only.
# Can write directly to Supabase (revsports_players table) when enabled.
# Also uploads CSV backups from the /data folder to Supabase Storage.
#
# Schedule (AEST = UTC+10):
#   Daily       — 2am AEST every day
#   Sat & Sun   — hourly from 8am to 8pm AEST (on the hour, same as HB)
#
# Manual trigger: Actions tab → "Scrape — Wimmera Hockey Association" → Run workflow

name: Scrape — Wimmera Hockey Association

on:
  schedule:
    # ── Daily 2am AEST (16:00 UTC) ───────────────────────────
    - cron: "0 16 * * *"

    # ── Saturday hourly 8am–8pm AEST ─────────────────────────
    - cron: "0 22 * * 5"   # 8:00am Sat
    - cron: "0 23 * * 5"   # 9:00am Sat
    - cron: "0 0  * * 6"   # 10:00am Sat
    - cron: "0 1  * * 6"   # 11:00am Sat
    - cron: "0 2  * * 6"   # 12:00pm Sat
    - cron: "0 3  * * 6"   # 1:00pm Sat
    - cron: "0 4  * * 6"   # 2:00pm Sat
    - cron: "0 5  * * 6"   # 3:00pm Sat
    - cron: "0 6  * * 6"   # 4:00pm Sat
    - cron: "0 7  * * 6"   # 5:00pm Sat
    - cron: "0 8  * * 6"   # 6:00pm Sat
    - cron: "0 9  * * 6"   # 7:00pm Sat
    - cron: "0 10 * * 6"   # 8:00pm Sat

    # ── Sunday hourly 8am–8pm AEST ────────────────────────────
    - cron: "0 22 * * 6"   # 8:00am Sun
    - cron: "0 23 * * 6"   # 9:00am Sun
    - cron: "0 0  * * 0"   # 10:00am Sun
    - cron: "0 1  * * 0"   # 11:00am Sun
    - cron: "0 2  * * 0"   # 12:00pm Sun
    - cron: "0 3  * * 0"   # 1:00pm Sun
    - cron: "0 4  * * 0"   # 2:00pm Sun
    - cron: "0 5  * * 0"   # 3:00pm Sun
    - cron: "0 6  * * 0"   # 4:00pm Sun
    - cron: "0 7  * * 0"   # 5:00pm Sun
    - cron: "0 8  * * 0"   # 6:00pm Sun
    - cron: "0 9  * * 0"   # 7:00pm Sun
    - cron: "0 10 * * 0"   # 8:00pm Sun

  workflow_dispatch:
    inputs:
      only_grades:
        description: 'Grades to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_rounds:
        description: 'Rounds to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_team:
        description: 'Team name filter (partial match, blank = all)'
        required: false
        default: ''
      upload_to_supabase:
        description: 'Upload scraped rows to Supabase? Scheduled runs always upload.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPLOAD_TO_SUPABASE: ${{ github.event_name == 'schedule' && 'true' || inputs.upload_to_supabase }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run scraper
        env:
          PORTAL_URL:           "https://www.revolutionise.com.au/wimmeraha"
          ASSOCIATION_NAME:     "Wimmera Hockey Association"
          OUTPUT_DIR:           "data/wimmera"
          UPSERT_SUPABASE:      ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2:   ${{ env.UPLOAD_TO_SUPABASE }}
          COMPETITION_ID:       "26593"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_GRADES:          ${{ github.event.inputs.only_grades || '' }}
          ONLY_ROUNDS:          ${{ github.event.inputs.only_rounds || '' }}
          ONLY_TEAM:            ${{ github.event.inputs.only_team   || '' }}
        run: python scraper/scraper.py

      - name: Upload backup to Supabase Storage
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/wimmera \
            --source-name wimmera

      - name: Run fixture import
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply
