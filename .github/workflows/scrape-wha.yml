# .github/workflows/scrape-wha.yml
#
# Match Scraper — Wimmera Hockey Association
# Scrapes fixture and result data from RevSports.
# Player data is login-protected on WHA — fixture/result data only.
# Can write directly to Supabase (revsports_players table) when enabled.
# Also uploads CSV backups from the /data folder to Supabase Storage.
#
# Manual fallback only. Normal Production scheduling is owned by
# production-scrapers.yml so it cannot accidentally run twice.

name: Scrape — Wimmera Hockey Association

on:
  workflow_dispatch:
    inputs:
      only_grades:
        description: 'Grades to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_rounds:
        description: 'Rounds to scrape (comma-separated, blank = all)'
        required: false
        default: ''
      only_team:
        description: 'Team name filter (partial match, blank = all)'
        required: false
        default: ''
      upload_to_supabase:
        description: 'Upload scraped rows to Production Supabase?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      upload_backup:
        description: 'Save a compressed Production Storage backup?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      UPLOAD_TO_SUPABASE: ${{ inputs.upload_to_supabase }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase

      - name: Run scraper
        env:
          PORTAL_URL:           "https://www.revolutionise.com.au/wimmeraha"
          ASSOCIATION_NAME:     "Wimmera Hockey Association"
          OUTPUT_DIR:           "data/wimmera"
          UPSERT_SUPABASE:      ${{ env.UPLOAD_TO_SUPABASE }}
          UPSERT_SUPABASE_V2:   ${{ env.UPLOAD_TO_SUPABASE }}
          COMPETITION_ID:       "26593"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ONLY_GRADES:          ${{ github.event.inputs.only_grades || '' }}
          ONLY_ROUNDS:          ${{ github.event.inputs.only_rounds || '' }}
          ONLY_TEAM:            ${{ github.event.inputs.only_team   || '' }}
        run: python scraper/scraper.py

      - name: Upload backup to Supabase Storage
        if: inputs.upload_backup == 'true'
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python scripts/upload_scrape_backups_to_storage.py \
            --source-dir data/wimmera \
            --source-name wimmera

      - name: Run fixture import
        if: env.UPLOAD_TO_SUPABASE == 'true'
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/fixture_import.py --apply
