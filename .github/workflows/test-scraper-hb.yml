# Test scraper output for Hockey Ballarat.
# This workflow is manual only and does not write to Supabase.
# It uploads the generated CSV/JSON/report files so they can be downloaded
# from the GitHub Actions run summary.

name: Test Scraper - Hockey Ballarat

on:
  workflow_dispatch:
    inputs:
      only_grades:
        description: "Grades to scrape, comma-separated. Leave blank for all."
        required: false
        default: ""
      only_rounds:
        description: "Rounds to scrape, comma-separated. Leave blank for all."
        required: false
        default: ""
      only_team:
        description: "Team name filter. Leave blank for all."
        required: false
        default: ""

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Run Hockey Ballarat scraper without Supabase
        env:
          PORTAL_URL: "https://www.revolutionise.com.au/hockeyballarat"
          ASSOCIATION_NAME: "Hockey Ballarat"
          OUTPUT_DIR: "data/hockey-ballarat"
          UPSERT_SUPABASE: "false"
          ONLY_GRADES: ${{ github.event.inputs.only_grades }}
          ONLY_ROUNDS: ${{ github.event.inputs.only_rounds }}
          ONLY_TEAM: ${{ github.event.inputs.only_team }}
        run: python scraper/scraper.py

      - name: Upload scraper output
        uses: actions/upload-artifact@v4
        with:
          name: hockey-ballarat-scraper-output
          path: data/hockey-ballarat/
          if-no-files-found: error
