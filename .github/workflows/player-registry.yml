# .github/workflows/player-registry.yml
#
# Player Registry Scraper
# Scrapes the season-wide Team Statistics page for every configured
# association/competition and writes results to revsports_player_registry.
#
# Also saves a CSV backup to data/player-registry/ in the repo.
#
# Uses Playwright (headless Chromium) because the stats page loads
# player data via JavaScript — plain requests can't see it.
#
# Schedule (AEST = UTC+10):
#   Nightly — 2am AEST every day
#
# Manual trigger: Actions tab → "Player Registry Scraper" → Run workflow

name: Player Registry Scraper

on:
  schedule:
    # Nightly 2am AEST = 16:00 UTC every day
    - cron: "0 16 * * *"

  workflow_dispatch:

jobs:
  scrape-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Force GitHub Actions to use Node.js 24 (required after June 2026 deprecation)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright beautifulsoup4 supabase

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run player registry scraper
        env:
          OUTPUT_DIR:           "data/player-registry"
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/player_registry_scraper.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "scrape(registry): $(date '+%Y-%m-%d %H:%M') AEST"
          git pull --rebase -X theirs
          git push
